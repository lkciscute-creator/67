<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Send</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2011739724-q0xB1N1j" });

        if (liff.isInClient()) {
          await liff.sendMessages([{ type: 'text', text: '我是gay' }]);
          liff.closeWindow();
        } else {
          alert("請在 LINE 聊天室內開啟此連結！");
        }
      } catch (error) {
        alert("錯誤訊息：" + error.message);
      }
    }
    main();
  </script>
</body>
</html>
